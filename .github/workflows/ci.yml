name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Every adapter builds against field_struct and actionable from git (or a
  # range of releases), and Gemfile.lock is not committed, so a nightly run
  # resolves the newest core code: a core change that breaks an adapter shows
  # up the next morning instead of when someone upgrades.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  gem:
    # GitHub-hosted: the self-hosted afs-ci runners are registered per repo,
    # and this one has none yet.
    runs-on: ubuntu-latest
    name: ${{ matrix.gem }} (Ruby ${{ matrix.ruby }})
    strategy:
      fail-fast: false
      matrix:
        gem:
          - actionable-otel
          - field_struct-avro
          - field_struct-json_schema
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
    defaults:
      run:
        working-directory: ${{ matrix.gem }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gem }}/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ matrix.gem }}
      - name: Specs and lint
        run: bundle exec rake

  # FieldStruct::JSONSchema.pattern_for promises patterns that match exactly
  # what the Ruby Regexp matches, under JavaScript's `u` flag. This runs the
  # promise: a corpus of Regexps, Ruby's answers computed on each Ruby in the
  # matrix, checked against Node's.
  json-schema-differential:
    runs-on: ubuntu-latest
    name: field_struct-json_schema regexps vs Node (Ruby ${{ matrix.ruby }})
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '4.0'
    defaults:
      run:
        working-directory: field_struct-json_schema
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/field_struct-json_schema/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: field_struct-json_schema
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Compare pattern_for with Node
        run: bundle exec rake differential
